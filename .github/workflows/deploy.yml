name: Deploy theme to Shopify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Push theme to live
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_FLAG_STORE: x1hna4-kw.myshopify.com
        run: |
          set -o pipefail
          shopify theme push \
            --theme 184572674359 \
            --allow-live \
            --nodelete 2>&1 | tee push.log

          # The CLI exits 0 even when it rejects files, so a rejected section
          # would otherwise show up here as a green deploy.
          if grep -q "pushed with errors" push.log; then
            echo "::error::Theme pushed with errors — some files were rejected."
            exit 1
          fi
